<!doctype html>
<html lang="fr">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Côte &amp; Carte</title>
<meta name="description" content="Côte & Carte s'arrête. Merci d'être passés regarder des cartes Pokémon avec nous.">
<meta name="robots" content="noindex">
<style>
  :root { --fond: #f6f1e4; --texte: #1d2a36; --doux: #5b6670; --or: #b08a3e; }
  @media (prefers-color-scheme: dark) {
    :root { --fond: #12201a; --texte: #f1ead8; --doux: #b9b3a2; --or: #d4b06a; }
  }
  * { box-sizing: border-box; }
  body {
    margin: 0; min-height: 100vh; display: grid; place-items: center;
    background: var(--fond); color: var(--texte);
    font: 17px/1.6 system-ui, -apple-system, "Segoe UI", Roboto, sans-serif;
    padding: 32px 16px;
  }
  main { max-width: 34rem; text-align: center; }
  img { width: min(280px, 70vw); height: auto; }
  h1 { font-size: 1.6rem; margin: 1.2rem 0 .6rem; }
  p { margin: .6rem 0; color: var(--doux); }
  a { color: var(--texte); text-decoration-color: var(--or); text-underline-offset: 3px; }
  .lien { display: inline-block; margin-top: 1.2rem; font-weight: 600; }
</style>
</head>
<body>
<main>
  <img src="logo.webp" width="480" height="342" alt="Le singe de Côte & Carte, une carte à la main">
  <h1>Côte &amp; Carte s'arrête</h1>
  <p>Le site a fermé ses portes. Merci à toutes celles et ceux qui sont passés feuilleter des cartes, jouer au Face à face ou remplir leur Cabane.</p>
  <p>Les comptes du site sont fermés et leurs données ne sont pas conservées.</p>
  <a class="lien" href="https://www.tiktok.com/@cotecarte">Les vidéos restent sur TikTok</a>
</main>
</body>
</html>
